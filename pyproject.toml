[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledger-rec"
version = "0.1.0"
description = "Ledger Reconciliation Agent — finds payment breaks and explains what it did"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["ledger", "reconciliation", "llm-agent", "fintech", "payments", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.26",
    "openai>=1.30",
    "anthropic>=0.25",
    "rich>=13.7",
    "pandas>=2.1",
    "numpy>=1.26",
    "faker>=22.0",
    "thefuzz>=0.22",
    "python-levenshtein>=0.25",
    "structlog>=24.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "ruff>=0.2",
    "mypy>=1.8",
]

[project.scripts]
ledger-rec = "ledger_rec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_rec"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "integration: requires live API or database",
    "slow: takes >30s",
]
